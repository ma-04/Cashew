name: CI Build

# Produces installable release artifacts on every push/PR so changes can be
# tested on a real device before tagging a release.
on:
  # Listing `branches` means tag pushes do not trigger this workflow;
  # those are handled by release.yml instead. Pushes to other branches are
  # covered by `pull_request`, or can be built on demand via `workflow_dispatch`
  # (Actions tab -> CI Build -> Run workflow), which avoids running twice for
  # every branch that has an open PR.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # Only compile errors fail the build. This is a large existing codebase
      # with plenty of pre-existing lint info/warnings that are not worth
      # blocking a build on.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      # android/app/build.gradle always reads signing config from
      # android/key.properties, so it must exist for a release build.
      # If signing secrets are configured we use the real upload key, otherwise
      # we generate a throwaway key just so the build can produce an
      # installable APK for testing.
      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$(pwd)/android/ci-keystore.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "Using the configured upload keystore."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set - generating a throwaway signing key."
            echo "::warning::Each build will be signed with a different key, so you must uninstall a previous CI build before installing a new one."
            STORE_PASSWORD="cibuild"
            KEY_PASSWORD="cibuild"
            KEY_ALIAS="ci"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype JKS \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Cashew CI, OU=CI, O=Cashew, L=None, S=None, C=US"
          fi
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: cashew-apk-${{ github.sha }}
          path: budget/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: cashew-web-${{ github.sha }}
          path: budget/build/web
          if-no-files-found: error
          retention-days: 30
